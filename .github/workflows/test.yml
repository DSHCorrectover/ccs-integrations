name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install adapter with core dependencies
        working-directory: adapters/ccs-pydantic-ai
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run tests (open-source verifier, no ccs-verifier dependency)
        working-directory: adapters/ccs-pydantic-ai
        run: pytest tests/test_open_verifier.py tests/test_signer.py tests/test_toolset.py -v --tb=short

      - name: Verify package builds
        working-directory: adapters/ccs-pydantic-ai
        run: |
          pip install build
          python -m build
