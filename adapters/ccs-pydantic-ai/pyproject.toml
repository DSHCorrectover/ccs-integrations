[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ccs-pydantic-ai"
version = "0.1.0"
description = "Cryptographic runtime receipts for Pydantic AI agents — signed Ed25519 audit evidence for every tool call. CCS (Correctover Conformance Shape) L1 + behavior receipts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Correctover / CCS Integrations" },
]
keywords = [
    "ai-security", "agent-security", "guardrails", "runtime-security", "llm-security",
    "cryptographic-receipts", "audit-trail", "non-repudiation", "compliance", "governance",
    "ed25519", "jcs", "rfc8785", "signed-receipts", "tamper-evidence", "verifiable",
    "runtime-verification", "tool-call-validation", "observability", "mcp",
    "pydantic-ai", "pydantic", "supply-chain-security", "owasp-asi", "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic-ai>=0.1.0",
    "jcs>=0.2.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
# The core verifier is ELv2-licensed and required for strict L1 parse + signature
# verification. It is not a hard dependency so the adapter can be installed in
# environments that only need to *produce* receipts.
verify = ["ccs-verifier==1.3.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ccs-verifier==1.3.0",
]


[project.scripts]
ccs-verify = "ccs_pydantic_ai.cli:main"

[project.urls]
Homepage = "https://github.com/DSHCorrectover/ccs-integrations"
Documentation = "https://github.com/DSHCorrectover/ccs-integrations/tree/main/adapters/ccs-pydantic-ai#readme"
Issues = "https://github.com/DSHCorrectover/ccs-integrations/issues"
Specification = "https://www.ietf.org/archive/id/draft-correctover-ccs-08.txt"
Conformance = "https://github.com/DSHCorrectover/ccs-conformance-vectors"

[tool.hatch.build.targets.wheel]
packages = ["src/ccs_pydantic_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
